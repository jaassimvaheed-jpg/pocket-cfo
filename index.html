<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pocket CFO</title>
<meta name="description" content="Your private CFO: Saudi and Indian accounts, cards, EMIs and remittances in one place.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pocket CFO">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0C1030">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://api.anthropic.com; worker-src 'self' blob: https://cdnjs.cloudflare.com; font-src 'self'; base-uri 'none'; form-action 'none'">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<style>
/* Layout: native-iPhone feel. Frosted nav bar with actions, large page title, inset grouped sections, frosted tab bar, bottom sheets, iOS-style passcode screen. */
:root{
  --bg:#F2F2F7; --surface:#FFFFFF; --surface-2:#EEEEF3; --fill:rgba(118,118,128,.12); --line:rgba(60,60,67,.16);
  --ink:#000000; --muted:#6C6C70; --accent:#007AFF; --accent-ink:#FFFFFF; --accent-soft:#E3EEFF;
  --biz:#AF52DE; --biz-soft:#F5EAFB;
  --pos:#248A3D; --pos-soft:#E1F5E6; --neg:#D70015; --neg-soft:#FDE6E7; --warn:#C93400; --warn-soft:#FFF0DF;
  --bar:rgba(249,249,249,.82); --scrim:rgba(0,0,0,.32);
  --lockbg:#1C1C1E; --lockink:#FFFFFF; --lockkey:rgba(255,255,255,.16);
  --shadow:0 12px 40px rgba(0,0,0,.18);
  --f-display:-apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --f-body:-apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --f-num:-apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#000000; --surface:#1C1C1E; --surface-2:#2C2C2E; --fill:rgba(118,118,128,.24); --line:rgba(84,84,88,.55);
  --ink:#FFFFFF; --muted:#98989F; --accent:#0A84FF; --accent-ink:#FFFFFF; --accent-soft:#0B2847;
  --biz:#BF5AF2; --biz-soft:#2E1A3A;
  --pos:#30D158; --pos-soft:#0E2E17; --neg:#FF453A; --neg-soft:#3A1412; --warn:#FF9F0A; --warn-soft:#3A2706;
  --bar:rgba(22,22,24,.82); --scrim:rgba(0,0,0,.55);
  --lockbg:#000000; --lockink:#FFFFFF; --lockkey:rgba(255,255,255,.14);
  --shadow:0 12px 40px rgba(0,0,0,.6); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1C1C1E; --surface-2:#2C2C2E; --fill:rgba(118,118,128,.24); --line:rgba(84,84,88,.55);
  --ink:#FFFFFF; --muted:#98989F; --accent:#0A84FF; --accent-ink:#FFFFFF; --accent-soft:#0B2847;
  --biz:#BF5AF2; --biz-soft:#2E1A3A;
  --pos:#30D158; --pos-soft:#0E2E17; --neg:#FF453A; --neg-soft:#3A1412; --warn:#FF9F0A; --warn-soft:#3A2706;
  --bar:rgba(22,22,24,.82); --scrim:rgba(0,0,0,.55);
  --lockbg:#000000; --lockink:#FFFFFF; --lockkey:rgba(255,255,255,.14);
  --shadow:0 12px 40px rgba(0,0,0,.6); color-scheme:dark }

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{color:var(--ink); font-family:var(--f-body); font-size:17px; line-height:1.35; letter-spacing:-.01em; -webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit; color:inherit; letter-spacing:inherit}
.app{max-width:600px; margin:0 auto; padding-inline:16px; padding-block:0 110px}
.num{font-family:var(--f-num); font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display); margin:0; text-wrap:balance}
.muted{color:var(--muted)}
.lbl{font-size:13px; text-transform:uppercase; letter-spacing:.02em; color:var(--muted); font-weight:400}

/* nav bar + large title */
.navbar{position:sticky; top:env(safe-area-inset-top,0px); z-index:6; margin-inline:-16px; padding:8px 12px 8px 16px; display:flex; align-items:center; justify-content:space-between; gap:10px; background:var(--bar); -webkit-backdrop-filter:saturate(180%) blur(20px); backdrop-filter:saturate(180%) blur(20px)}
.navbar .tag{font-size:13px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; display:flex; align-items:center; gap:6px}
.navbar .tag::before{content:""; width:7px; height:7px; border-radius:50%; background:var(--pos); flex:none}
.tools{display:flex; gap:2px; flex:none}
.iconbtn{width:40px; height:40px; border-radius:20px; border:0; background:transparent; color:var(--accent); display:grid; place-items:center; cursor:pointer}
.iconbtn svg{width:23px; height:23px; stroke:currentColor; fill:none; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round}
.iconbtn[aria-pressed="true"]{background:var(--accent-soft)}
.iconbtn.add svg{stroke-width:2.4}
.top{display:flex; flex-direction:column; gap:12px; padding-block:4px 14px}
.top h1{font-size:34px; font-weight:700; letter-spacing:.01em; line-height:1.2}
.seg{display:grid; grid-template-columns:repeat(3,1fr); background:var(--fill); border-radius:9px; padding:2px; gap:2px}
.seg button{border:0; background:transparent; padding:6px 6px; border-radius:7px; font-weight:500; font-size:13px; cursor:pointer; color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--surface); font-weight:600; box-shadow:0 3px 8px rgba(0,0,0,.12), 0 0 0 .5px rgba(0,0,0,.04)}
.seg.two{grid-template-columns:1fr 1fr}

/* sections */
.stack{display:flex; flex-direction:column; gap:22px}
.card{background:var(--surface); border-radius:14px; padding:16px; min-width:0}
.card h2{font-size:20px; font-weight:700}
.cardhead{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:12px}
.banner{background:var(--accent-soft); border-radius:14px; padding:14px 16px; display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap}
.banner p{margin:0; font-size:15px; flex:1 1 220px}
.hero{background:var(--surface); border-radius:14px; padding:18px 16px}
.hero .big{font-family:var(--f-num); font-size:clamp(34px,10vw,44px); font-weight:700; letter-spacing:-.02em; line-height:1.1; margin-top:4px; font-variant-numeric:tabular-nums}
.hero .sub{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; margin-top:14px; padding-top:14px; border-top:.5px solid var(--line); font-size:13px}
.hero .sub b{display:block; font-size:17px; font-weight:600; color:var(--ink); margin-top:2px}
.trio{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.trio > div{min-width:0}
.trio .v{font-family:var(--f-num); font-variant-numeric:tabular-nums; font-size:20px; font-weight:600; margin-top:2px; overflow-wrap:anywhere}
.pos{color:var(--pos)} .neg{color:var(--neg)} .warnc{color:var(--warn)}
.pill{display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:600; padding:4px 10px; border-radius:999px; white-space:nowrap}
.pill.good{background:var(--pos-soft); color:var(--pos)} .pill.warn{background:var(--warn-soft); color:var(--warn)} .pill.risk{background:var(--neg-soft); color:var(--neg)} .pill.info{background:var(--accent-soft); color:var(--accent)}
.chip-ent{font-size:11px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; padding:3px 7px; border-radius:6px}
.chip-ent.personal{background:var(--accent-soft); color:var(--accent)} .chip-ent.business{background:var(--biz-soft); color:var(--biz)}
.forecast{margin-top:14px; padding-top:14px; border-top:.5px solid var(--line); display:flex; justify-content:space-between; gap:10px; align-items:baseline; font-size:15px}
.forecast b{font-size:17px}

.health{display:grid; grid-template-columns:100px minmax(0,1fr); gap:18px; align-items:center}
.gauge{position:relative; width:100px; height:100px}
.gauge svg{width:100px; height:100px; transform:rotate(-90deg)}
.gauge .trk{stroke:var(--fill)} .gauge .val{stroke-linecap:round}
.gauge b{position:absolute; inset:0; display:grid; place-items:center; font-family:var(--f-display); font-size:32px; font-weight:700}
.parts{display:flex; flex-direction:column; gap:7px; font-size:15px}
.parts div{display:flex; justify-content:space-between; gap:8px}
.parts span:last-child{font-variant-numeric:tabular-nums; color:var(--muted)}

.notes{display:flex; flex-direction:column}
.note{display:grid; grid-template-columns:28px 1fr; gap:12px; align-items:start; padding-block:11px; border-top:.5px solid var(--line)}
.note:first-child{border-top:0; padding-top:0}
.note .bar{width:28px; height:28px; border-radius:8px; display:grid; place-items:center; color:#fff; font-weight:700; font-size:15px}
.note .bar::before{content:"!"}
.note.good .bar{background:var(--pos)} .note.good .bar::before{content:"✓"}
.note.warn .bar{background:var(--warn)} .note.risk .bar{background:var(--neg)}
.note.info .bar{background:var(--accent)} .note.info .bar::before{content:"i"; font-family:Georgia,serif; font-style:italic}
.note b{display:block; font-weight:600; font-size:16px}
.note p{margin:3px 0 0; font-size:15px; color:var(--muted)}

.catrow{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:6px 12px; align-items:baseline}
.catrow + .catrow{margin-top:14px}
.catrow .num{font-size:15px}
.track{grid-column:1/-1; height:6px; border-radius:3px; background:var(--fill); overflow:hidden; position:relative}
.track i{display:block; height:100%; border-radius:3px; background:var(--accent)}
.track i.good{background:var(--pos)} .track i.warn{background:var(--warn)} .track i.risk{background:var(--neg)}
.track .pace{position:absolute; top:0; bottom:0; width:2px; background:var(--ink); opacity:.35}
.catrow small{grid-column:1/-1; color:var(--muted); font-size:13px}
.chart{width:100%; height:auto; display:block}
.chart text{fill:var(--muted); font-family:var(--f-num); font-size:10px}
.chart .gin{fill:var(--pos)} .chart .gout{fill:var(--neg); opacity:.85} .chart .grid{stroke:var(--line)} .chart .cur{fill:var(--ink); font-weight:600}
.legend{display:flex; gap:14px; font-size:13px; color:var(--muted); margin-top:8px}
.legend span::before{content:""; display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; vertical-align:0; background:var(--c)}
.split{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.split > div{background:var(--surface-2); border-radius:12px; padding:12px; min-width:0}
.comp{display:flex; height:10px; border-radius:5px; overflow:hidden; background:var(--fill); margin:14px 0 10px; gap:2px}
.comp i{display:block; height:100%}

.list{display:flex; flex-direction:column}
.row{display:grid; grid-template-columns:38px minmax(0,1fr) auto; gap:12px; align-items:center; padding:10px 0; border:0; border-top:.5px solid var(--line); background:none; text-align:left; width:100%; cursor:pointer}
.row:first-child{border-top:0}
.row.static{cursor:default}
.row:not(.static):active{opacity:.6}
.row .ic{width:38px; height:38px; border-radius:10px; display:grid; place-items:center; font-weight:700; font-size:14px; font-family:var(--f-display)}
.row .ic.personal{background:var(--accent-soft); color:var(--accent)} .row .ic.business{background:var(--biz-soft); color:var(--biz)}
.row .t{min-width:0}
.row .t b{display:block; font-weight:500; font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.row .t span{font-size:13px; color:var(--muted)}
.row .a{text-align:right; font-variant-numeric:tabular-nums; font-size:16px; font-weight:500}
.row .a small{display:block; color:var(--muted); font-size:12px; font-weight:400}
.monthhead{display:flex; justify-content:space-between; align-items:baseline; padding:0 4px 8px}
.monthhead h3{font-size:13px; text-transform:uppercase; letter-spacing:.02em; color:var(--muted); font-weight:400}
.empty{text-align:center; padding:20px 12px; color:var(--muted); font-size:15px}
.empty b{display:block; color:var(--ink); font-family:var(--f-display); font-size:17px; font-weight:600; margin-bottom:4px}

.btn{border:0; background:var(--fill); color:var(--accent); padding:12px 16px; border-radius:12px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px; font-size:17px}
.btn.primary{background:var(--accent); color:var(--accent-ink)}
.btn.danger{color:var(--neg); background:var(--neg-soft)}
.btn.small{padding:6px 12px; font-size:15px; border-radius:999px}
.btn:disabled{opacity:.4; cursor:default}
.btn:not(:disabled):active{opacity:.7}
.btn.block{width:100%}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.field{display:flex; flex-direction:column; gap:6px; min-width:0}
.field label{font-size:13px; color:var(--muted); padding-left:4px}
.field input,.field select,.field textarea{width:100%; border:0; background:var(--surface-2); border-radius:10px; padding:12px; font-size:17px; min-width:0; -webkit-appearance:none; appearance:none}
.field select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%); background-position:calc(100% - 18px) 52%, calc(100% - 13px) 52%; background-size:5px 5px; background-repeat:no-repeat; padding-right:32px}
.field textarea{min-height:110px; resize:vertical; font-size:15px}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.search{width:100%; border:0; background:var(--fill); border-radius:10px; padding:9px 12px; font-size:17px; -webkit-appearance:none}
.sect{display:flex; flex-direction:column; gap:12px; padding-top:18px; margin-top:18px; border-top:.5px solid var(--line)}
.sect h3{font-size:13px; text-transform:uppercase; letter-spacing:.02em; color:var(--muted); font-weight:400}
.check{display:flex; gap:10px; align-items:center; font-size:16px}
.check input{width:22px; height:22px; accent-color:var(--accent)}

.nav{position:fixed; left:0; right:0; bottom:0; z-index:8; background:var(--bar); -webkit-backdrop-filter:saturate(180%) blur(20px); backdrop-filter:saturate(180%) blur(20px); border-top:.5px solid var(--line); padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .in{max-width:600px; margin:0 auto; display:grid; grid-template-columns:repeat(5,1fr)}
.nav button{border:0; background:none; padding:7px 2px 6px; display:flex; flex-direction:column; align-items:center; gap:2px; font-size:10px; font-weight:500; color:var(--muted); cursor:pointer}
.nav button svg{width:26px; height:26px; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--accent)}
.nav button[aria-current="page"] svg{stroke-width:2.1}

.scrim{position:fixed; inset:0; background:var(--scrim); z-index:20; display:flex; align-items:flex-end; justify-content:center}
.sheet{background:var(--bg); width:100%; max-width:600px; max-height:94%; overflow:auto; border-radius:12px 12px 0 0; padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px)); box-shadow:var(--shadow)}
.sheet .grab{width:36px; height:5px; border-radius:3px; background:var(--muted); opacity:.4; margin:0 auto 12px; touch-action:none}
.sheet .draghandle{margin:-8px -16px 0; padding:8px 16px 0; touch-action:none; cursor:grab}
.sheet h2{font-size:17px; font-weight:600; text-align:center; margin-bottom:16px}
.sheet form{display:flex; flex-direction:column; gap:14px}
.sheet .field input,.sheet .field select,.sheet .field textarea,.sheet .search{background:var(--surface)}
.sheet .actions{display:flex; gap:10px; margin-top:6px}
.sheet .actions .btn{flex:1}
.sheet .row{background:var(--surface); border-radius:12px; padding:12px}
.confirm{background:var(--neg-soft); border-radius:12px; padding:14px; display:flex; flex-direction:column; gap:12px; font-size:15px}
.hint{background:var(--warn-soft); color:var(--ink); border-radius:12px; padding:12px; font-size:14px}

.chat{display:flex; flex-direction:column; gap:8px}
.msg{max-width:85%; padding:9px 14px; border-radius:18px; font-size:16px; overflow-wrap:anywhere}
.msg.me{align-self:flex-end; background:var(--accent); color:var(--accent-ink); border-bottom-right-radius:5px}
.msg.cfo{align-self:flex-start; background:var(--surface); border-bottom-left-radius:5px}
.msg.cfo p{margin:0 0 8px} .msg.cfo p:last-child{margin:0}
.msg.cfo ul{margin:0 0 8px; padding-left:18px}
.chips{display:flex; gap:8px; flex-wrap:wrap}
.chips button{border:0; background:var(--surface); color:var(--accent); border-radius:999px; padding:8px 14px; font-size:15px; cursor:pointer; text-align:left}
.chips button:disabled{color:var(--muted)}
.composer{display:flex; gap:8px; align-items:flex-end}
.composer textarea{flex:1; min-width:0; border:.5px solid var(--line); background:var(--surface); border-radius:20px; padding:9px 14px; font-size:17px; resize:none; min-height:40px; max-height:140px}
.composer .btn{border-radius:20px; padding:9px 16px}

.drop{background:var(--surface-2); border-radius:12px; padding:16px; text-align:center; display:flex; flex-direction:column; gap:10px; align-items:center; font-size:15px}
.drop input{max-width:100%; font-size:15px}
.prev{display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:6px 10px; align-items:center; padding:10px 0; border-top:.5px solid var(--line)}
.prev input[type=checkbox]{width:22px; height:22px; accent-color:var(--accent)}
.prev .d{grid-column:2; min-width:0}
.prev .d b{display:block; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:15px}
.prev select{grid-column:2/4; border:0; background:var(--fill); border-radius:8px; padding:6px 8px; font-size:14px; max-width:100%}
.prev.dupe{opacity:.5}
.steps{display:flex; flex-direction:column; gap:10px; margin:0; padding-left:22px; font-size:15px}
.steps li::marker{color:var(--accent); font-weight:600}
.steps code{font-family:ui-monospace,"SF Mono",Menlo,monospace; font-size:13px; background:var(--fill); padding:2px 5px; border-radius:5px; overflow-wrap:anywhere}

.lock{position:fixed; inset:0; z-index:50; background:var(--lockbg); color:var(--lockink); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.lock h2{font-size:20px; font-weight:400; color:var(--lockink)}
.lock p{margin:0; font-size:15px; opacity:.8; text-align:center; min-height:1.4em}
.dots{display:flex; gap:22px}
.dots i{width:13px; height:13px; border-radius:50%; border:1.5px solid var(--lockink)}
.dots i.on{background:var(--lockink)}
.keys{display:grid; grid-template-columns:repeat(3,78px); gap:16px 26px; margin-top:12px}
.keys button{width:78px; height:78px; border-radius:50%; border:0; background:var(--lockkey); color:var(--lockink); font-family:var(--f-display); font-size:34px; font-weight:400; cursor:pointer}
.keys button:active{background:rgba(255,255,255,.4)}
.keys button.txt{font-family:var(--f-body); font-size:16px; background:transparent}
.keys button:disabled{opacity:.3}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-12px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.boot{padding-block:80px; text-align:center; color:var(--muted)}

.toast{position:fixed; left:50%; transform:translateX(-50%); top:calc(60px + env(safe-area-inset-top,0px)); background:var(--surface); color:var(--ink); padding:12px 18px; border-radius:999px; font-size:15px; font-weight:500; z-index:60; max-width:calc(100% - 32px); box-shadow:var(--shadow)}
@media (prefers-reduced-motion: no-preference){ .sheet{animation:up .28s cubic-bezier(.2,.9,.3,1)} @keyframes up{from{transform:translateY(40px); opacity:.5}} }
@media (prefers-reduced-motion: reduce){ .shake{animation:none} }
/* ---------- motion ---------- */
:root{ --spring:cubic-bezier(.32,.72,0,1); --ease-out:cubic-bezier(.2,.8,.2,1) }
.navbar{transition:box-shadow .2s}
.navbar.scrolled{box-shadow:0 .5px 0 var(--line)}
.navtitle{position:absolute; left:50%; transform:translateX(-50%); font-size:17px; font-weight:600; opacity:0; pointer-events:none; white-space:nowrap; transition:opacity .15s}
.navbar .tag{transition:opacity .15s}
.seg{position:relative}
.seg .thumb{position:absolute; top:2px; bottom:2px; left:2px; width:calc((100% - 4px) / var(--n,3)); border-radius:7px; background:var(--surface); box-shadow:0 3px 8px rgba(0,0,0,.12), 0 0 0 .5px rgba(0,0,0,.04); transform:translateX(calc(var(--i,0) * 100%)); transition:transform .35s var(--spring)}
.seg button{position:relative; z-index:1; transition:font-weight .2s}
.seg button[aria-pressed="true"]{background:transparent; box-shadow:none}
.sheet .seg .thumb{background:var(--surface)}
.btn,.chips button,.iconbtn,.row,.keys button,.nav button{transition:transform .18s var(--ease-out), opacity .18s, background-color .2s}
.btn:not(:disabled):active,.chips button:active,.iconbtn:active{transform:scale(.95); opacity:.85}
.row:not(.static):active{transform:scale(.985); opacity:.7}
.keys button:active{transform:scale(.92)}
.dots i{transition:background-color .15s, transform .2s var(--spring)}
.dots i.on{transform:scale(1.15)}
.nav button.bounce svg{animation:bounce .45s var(--spring)}
@keyframes bounce{0%{transform:scale(1)}35%{transform:scale(.8)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
.scrim{transition:background-color .3s}
.scrim.closing{background:transparent}
.sheet{transition:transform .3s var(--spring)}
.scrim.closing .sheet{transform:translateY(105%)}
.sheet.dragging{transition:none}
.lock.unlocking{animation:unlockOut .35s ease-in forwards}
@keyframes unlockOut{to{opacity:0; transform:scale(1.12)}}
.lock.intro{animation:fadeIn .25s ease-out}
@keyframes fadeIn{from{opacity:0}}
.chat .msg:last-child{animation:msgIn .35s var(--spring) both}
@keyframes msgIn{from{opacity:0; transform:translateY(10px) scale(.96)}}
.msg.me{transform-origin:right bottom} .msg.cfo{transform-origin:left bottom}
@media (prefers-reduced-motion: no-preference){
  #view.enter-r{animation:pageR .42s var(--spring) both}
  #view.enter-l{animation:pageL .42s var(--spring) both}
  #view.enter-up > *{animation:rise .55s var(--spring) both}
  #view.enter-up > *:nth-child(2){animation-delay:.04s} #view.enter-up > *:nth-child(3){animation-delay:.08s}
  #view.enter-up > *:nth-child(4){animation-delay:.12s} #view.enter-up > *:nth-child(5){animation-delay:.16s}
  #view.enter-up > *:nth-child(6){animation-delay:.2s} #view.enter-up > *:nth-child(n+7){animation-delay:.24s}
  .enter .chart rect{transform-box:fill-box; transform-origin:50% 100%; animation:growY .8s var(--spring) both; animation-delay:calc(var(--d,0) * 45ms + .15s)}
  .enter .track i{transform-origin:0 50%; animation:growX .9s var(--spring) both; animation-delay:calc(var(--d,0) * 50ms + .2s)}
  .enter .comp i{transform-origin:0 50%; animation:growX .8s var(--spring) both; animation-delay:calc(var(--d,0) * 70ms + .15s)}
  .enter .gauge .val{animation:draw 1.2s var(--ease-out) .2s both}
  .enter .note{animation:noteIn .5s var(--spring) both; animation-delay:calc(var(--d,0) * 60ms + .2s)}
  .enter .note .bar{animation:pop .5s var(--spring) both; animation-delay:calc(var(--d,0) * 60ms + .3s)}
  .enter .pill{animation:pop .45s var(--spring) .35s both}
  .toast:not([hidden]){animation:toastIn .45s var(--spring)}
}
@keyframes pageR{from{opacity:0; transform:translateX(28px)}}
@keyframes pageL{from{opacity:0; transform:translateX(-28px)}}
@keyframes rise{from{opacity:0; transform:translateY(16px)}}
@keyframes growY{from{transform:scaleY(0)}}
@keyframes growX{from{transform:scaleX(0)}}
@keyframes draw{from{stroke-dashoffset:var(--C)}}
@keyframes noteIn{from{opacity:0; transform:translateX(-10px)}}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes toastIn{from{opacity:0; transform:translate(-50%,-30px) scale(.9)}to{transform:translate(-50%,0)}}

/* ---------- Liquid Glass layer: animated colour field behind translucent, specular panels ---------- */
:root{
  --glass:rgba(255,255,255,.58); --glass-strong:rgba(255,255,255,.78); --glass-input:rgba(255,255,255,.72);
  --glass-edge:rgba(255,255,255,.75); --glass-line:rgba(255,255,255,.45); --glass-shadow:0 8px 32px rgba(31,38,135,.12), 0 1px 2px rgba(0,0,0,.06);
  --blob1:#7FB2FF; --blob2:#C49BFF; --blob3:#7EE2D0; --blob4:#FFB48A; --field:#EEF1F8;
  --spark:#007AFF; --spark-fill:rgba(0,122,255,.22);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --glass:rgba(40,40,46,.48); --glass-strong:rgba(58,58,66,.66); --glass-input:rgba(255,255,255,.08);
  --glass-edge:rgba(255,255,255,.22); --glass-line:rgba(255,255,255,.1); --glass-shadow:0 10px 40px rgba(0,0,0,.45), 0 1px 2px rgba(0,0,0,.3);
  --blob1:#1D4ED8; --blob2:#7C3AED; --blob3:#0F766E; --blob4:#BE185D; --field:#05060A;
  --spark:#5AC8FA; --spark-fill:rgba(90,200,250,.25); } }
:root[data-theme="dark"]{
  --glass:rgba(40,40,46,.48); --glass-strong:rgba(58,58,66,.66); --glass-input:rgba(255,255,255,.08);
  --glass-edge:rgba(255,255,255,.22); --glass-line:rgba(255,255,255,.1); --glass-shadow:0 10px 40px rgba(0,0,0,.45), 0 1px 2px rgba(0,0,0,.3);
  --blob1:#1D4ED8; --blob2:#7C3AED; --blob3:#0F766E; --blob4:#BE185D; --field:#05060A;
  --spark:#5AC8FA; --spark-fill:rgba(90,200,250,.25); }

html,body{background:var(--field)}
.bg{position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; background:var(--field)}
.bg i{position:absolute; width:70vmax; height:70vmax; border-radius:50%; opacity:.75; will-change:transform}
.bg i:nth-child(1){background:radial-gradient(circle at center, var(--blob1) 0%, transparent 62%); left:-25vmax; top:-20vmax; animation:drift1 26s ease-in-out infinite alternate}
.bg i:nth-child(2){background:radial-gradient(circle at center, var(--blob2) 0%, transparent 62%); right:-30vmax; top:10vh; animation:drift2 32s ease-in-out infinite alternate}
.bg i:nth-child(3){background:radial-gradient(circle at center, var(--blob3) 0%, transparent 62%); left:-15vmax; bottom:-30vmax; animation:drift3 29s ease-in-out infinite alternate}
.bg i:nth-child(4){background:radial-gradient(circle at center, var(--blob4) 0%, transparent 60%); right:-20vmax; bottom:-35vmax; opacity:.55; animation:drift1 36s ease-in-out infinite alternate-reverse}
@keyframes drift1{to{transform:translate(18vmax,22vmax) scale(1.15)}}
@keyframes drift2{to{transform:translate(-22vmax,18vmax) scale(.9)}}
@keyframes drift3{to{transform:translate(20vmax,-24vmax) scale(1.1)}}

/* glass surfaces */
.card,.hero,.banner,.sheet,.chips button,.msg.cfo,.composer textarea,.toast,.search,.drop{
  background:var(--glass); -webkit-backdrop-filter:blur(24px) saturate(180%); backdrop-filter:blur(24px) saturate(180%);

.split > div,.sheet .row{background:var(--glass-input)}
.row,.note,.prev,.forecast,.hero .sub,.sect{border-color:var(--glass-line)}
.track,.comp{background:rgba(120,120,128,.18)}

/* top bar: transparent, glass once scrolled; tool buttons in a glass capsule */
.navbar{background:transparent; -webkit-backdrop-filter:none; backdrop-filter:none; transition:background-color .25s, box-shadow .25s}
.navbar.scrolled{background:var(--glass); -webkit-backdrop-filter:blur(24px) saturate(180%); backdrop-filter:blur(24px) saturate(180%); box-shadow:inset 0 -.5px 0 var(--glass-line)}

.seg{background:var(--glass); -webkit-backdrop-filter:blur(20px) saturate(180%); backdrop-filter:blur(20px) saturate(180%); border-radius:999px; padding:3px; box-shadow:inset 0 1px 0 var(--glass-edge), inset 0 0 0 .5px var(--glass-line)}

/* floating tab bar with a sliding glass pill */
.nav{left:12px; right:12px; bottom:calc(10px + env(safe-area-inset-bottom,0px)); padding:4px; max-width:560px; margin:0 auto; border:0; border-radius:32px;
  background:var(--glass); -webkit-backdrop-filter:blur(28px) saturate(190%); backdrop-filter:blur(28px) saturate(190%);

.nav .pill{position:absolute; top:0; bottom:0; left:0; width:20%; border-radius:28px; background:var(--glass-strong); box-shadow:inset 0 1px 0 var(--glass-edge), 0 2px 10px rgba(0,0,0,.08); transform:translateX(calc(var(--i,0) * 100%)); transition:transform .45s var(--spring)}
.nav button{position:relative; z-index:1; padding:7px 2px 6px; border-radius:28px}
.app{padding-block:0 120px}

/* sheets & inputs */
.sheet{border-radius:28px 28px 0 0; -webkit-backdrop-filter:blur(40px) saturate(180%); backdrop-filter:blur(40px) saturate(180%); background:var(--glass-strong)}
.sheet .field input,.sheet .field select,.sheet .field textarea,.sheet .search,.field input,.field select,.field textarea{background:var(--glass-input); box-shadow:inset 0 0 0 .5px var(--glass-line)}
.btn{background:var(--glass-input); box-shadow:inset 0 1px 0 var(--glass-edge), inset 0 0 0 .5px var(--glass-line)}
.btn.primary{background:linear-gradient(180deg, color-mix(in srgb, var(--accent) 82%, white), var(--accent)); box-shadow:0 6px 18px color-mix(in srgb, var(--accent) 35%, transparent), inset 0 1px 0 rgba(255,255,255,.45)}
.btn.danger{background:var(--neg-soft)}
.btn.small{border-radius:999px}
.chips button{border-radius:999px}
.msg.cfo{border-radius:20px 20px 20px 6px}
.msg.me{background:linear-gradient(180deg, color-mix(in srgb, var(--accent) 80%, white), var(--accent)); box-shadow:0 4px 14px color-mix(in srgb, var(--accent) 30%, transparent)}
.toast{border-radius:999px}
.scrim{background:rgba(0,0,0,.18)}

/* lock screen floats over the colour field */
.lock{background:color-mix(in srgb, var(--lockbg) 55%, transparent); -webkit-backdrop-filter:blur(40px) saturate(160%); backdrop-filter:blur(40px) saturate(160%)}
.keys button{background:rgba(255,255,255,.14); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); box-shadow:inset 0 1px 0 rgba(255,255,255,.25), inset 0 0 0 .5px rgba(255,255,255,.15)}
.keys button.txt{box-shadow:none; -webkit-backdrop-filter:none; backdrop-filter:none}

/* charts */
.trend{margin-top:12px; display:block; width:100%; height:auto; overflow:visible}
.trend .line{fill:none; stroke:var(--spark); stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; filter:drop-shadow(0 4px 8px var(--spark-fill))}
.trend .area{fill:url(#trendFill)}
.trend .dot{fill:var(--spark)} .trend .halo{fill:var(--spark); opacity:.25}
.trend text{fill:var(--muted); font-size:10px; font-family:var(--f-num)}
.trendhead{display:flex; justify-content:space-between; align-items:center; gap:8px; margin-top:10px}
.chart .gin{fill:url(#gIn)} .chart .gout{fill:url(#gOut); opacity:1}
.gauge .val{filter:drop-shadow(0 0 6px color-mix(in srgb, var(--accent) 45%, transparent))}
.track i{background:linear-gradient(90deg, color-mix(in srgb, var(--accent) 70%, white), var(--accent))}
.track i.good{background:linear-gradient(90deg, color-mix(in srgb, var(--pos) 65%, white), var(--pos))}
.track i.warn{background:linear-gradient(90deg, color-mix(in srgb, var(--warn) 65%, white), var(--warn))}
.track i.risk{background:linear-gradient(90deg, color-mix(in srgb, var(--neg) 65%, white), var(--neg))}
.note .bar{box-shadow:0 3px 10px rgba(0,0,0,.15), inset 0 1px 0 rgba(255,255,255,.35)}
.row .ic{box-shadow:inset 0 1px 0 var(--glass-edge)}

@media (prefers-reduced-motion: no-preference){
  .enter .hero::after{animation:sheen 1.6s var(--ease-out) .35s both}
  .enter .trend .line{stroke-dasharray:1; animation:drawLine 1.4s var(--ease-out) .2s both}
  .enter .trend .area{animation:fadeArea 1s ease-out .7s both}
  .enter .trend .dot{animation:pop .5s var(--spring) 1.4s both}
  .trend .halo{transform-box:fill-box; transform-origin:center; animation:pulse 2.4s ease-out infinite}
  .card,.hero{transition:transform .25s var(--spring)}
  .card:active,.hero:active{transform:scale(.99)}
}

function categorize(desc, amt){

  if(learned && (amt>0) === INC_CATS.includes(learned)) return learned;
  for(const [re,cat,dir] of RULES){ if(dir==='in' && amt<0) continue; if(dir!=='in' && dir!=='any' && amt>0) continue; if(re.test(desc)) return cat; }

}
function learnCat(desc, cat){
  const k=normKey(desc); if(!k) return false;
  S.core.learn = S.core.learn || {};
  if(S.core.learn[k]===cat) return false;
  S.core.learn[k]=cat;
  const keys=Object.keys(S.core.learn); if(keys.length>600) delete S.core.learn[keys[0]];

}
function monthStats(list, ym){
  let inc=0, exp=0; const cats={};
  for(const t of list){ if(ymOf(t.d)!==ym || isTransfer(t)) continue; const v=toBase(t.amt,t.cur); if(v>0) inc+=v; else { exp+=-v; cats[t.cat]=(cats[t.cat]||0)-v; } }
  return {inc, exp, net:inc-exp, cats};
}
function balance(e){
  let assets=0, liabs=0, liquid=0, byType={};
  for(const it of S.core.items){ if(!(e==='all'||it.ent===e) || !inRegion(it)) continue; const v=toBase(it.val,it.cur);
    if(it.kind==='asset'){ assets+=v; if(it.type==='bank'||it.type==='cash') liquid+=v; byType[it.type]=(byType[it.type]||0)+v; } else liabs+=v; }

}

  for(const ym of ms){ const s=monthStats(list,ym); if(s.inc||s.exp){ inc+=s.inc; exp+=s.exp; c++; } }

/* Bills & subscriptions: same payee, similar amount, in 3 of the last 4 full months. */
let recCache=null, recSig='';
function recurring(){
  let h=0; for(const t of S.tx) h=(h*31 + t.amt*7 + t.d.charCodeAt(9) + t.id.charCodeAt(0))%1e9;
  const sig=S.tx.length+'|'+h+'|'+S.core.base+'|'+JSON.stringify(S.core.rates);
  if(recCache && sig===recSig) return recCache;
  const ms=lastMonths(5), full=ms.slice(0,4), curYm=ms[4];
  const groups={};
  for(const t of S.tx){ const ym=ymOf(t.d); if(!ms.includes(ym)) continue; const k=normKey(t.note)||t.cat.toLowerCase(); const g=t.ent+'|'+(t.amt>0?'in':'out')+'|'+k+'|'+t.cur; (groups[g]=groups[g]||[]).push(t); }
  const out=[]; const ids=new Set();
  for(const [g,list] of Object.entries(groups)){
    const byM={}; for(const t of list){ const ym=ymOf(t.d); (byM[ym]=byM[ym]||[]).push(t); }
    const fullHits=full.filter(m=>byM[m]&&byM[m].length===1);
    if(fullHits.length<3) continue;
    const amts=fullHits.map(m=>Math.abs(byM[m][0].amt)), med=median(amts);
    if(!med || (Math.max(...amts)-Math.min(...amts))/med>0.25) continue;
    const day=Math.round(median(fullHits.map(m=>Number(byM[m][0].d.slice(8)))));
    const latest=list.sort((a,b)=>b.d.localeCompare(a.d))[0];

    const prevAmt=Math.abs(byM[fullHits[fullHits.length-1]][0].amt), olderAmt=Math.abs(byM[fullHits[0]][0].amt);

    const [y,m]=curYm.split('-').map(Number);
    const nd = paid ? new Date(y, m, Math.min(day,28)) : new Date(y, m-1, Math.min(day, daysIn(curYm)));
    const next = ymdStr(nd.getFullYear(), nd.getMonth()+1, nd.getDate());
    list.forEach(t=>ids.add(t.id));
    out.push({key:g, name:latest.note||latest.cat, cat:latest.cat, ent:latest.ent, cur:latest.cur, amt:(latest.amt>0?1:-1)*med, day, paid, next, change, ids:list.map(t=>t.id)});

function forecast(){

  let recInLeft=0, recOutLeft=0;

function nextDay(day){
  const t=new Date(); let y=t.getFullYear(), m=t.getMonth()+1;
  let d=ymdStr(y,m,Math.min(day,daysIn(`${y}-${pad(m)}`)));
  if(d<todayStr()){ m++; if(m>12){ m=1; y++; } d=ymdStr(y,m,Math.min(day,daysIn(`${y}-${pad(m)}`))); }
  return d;
}
function taxDeadlines(){

      for(const [m,d,n] of inst) out.push({d:ymdStr(y,m,d), name:n, kind:'tax', ent:'business', country:'IN'});
    }
    if(c.itr!==false) out.push({d:ymdStr(y,c.audit?10:7,31), name:'India income tax return (ITR) due', kind:'tax', ent:c.advance?'business':'personal', country:'IN'});
    for(let m=1;m<=12;m++){

function upcoming(days=30){
  const today=todayStr(), end=addDays(today,days), out=[];
  for(const i of S.core.items){ if(i.kind!=='liab' || !inEnt(i)) continue;
    if(i.type==='card' && (i.dueDate || i.dueDay)){
      const d=(i.dueDate && i.dueDate>=today) ? i.dueDate : (i.dueDay ? nextDay(i.dueDay) : null);
      const amt=i.stmtDue!=null ? i.stmtDue : i.val;
      if(d && d<=end && amt>0) out.push({d, name:`${i.name} bill`, amt, cur:i.cur, kind:'card', from:i.payFrom, min:i.minDue, ent:i.ent, item:i.id}); }
    if(['loan','mortgage'].includes(i.type) && i.pay && i.emiDay){ const d=nextDay(i.emiDay); if(d<=end) out.push({d, name:`${i.name} EMI`, amt:i.pay, cur:i.cur, kind:'emi', from:i.payFrom, ent:i.ent, item:i.id}); }
  }
  const haveEmi=S.core.items.some(i=>i.emiDay);
  for(const r of recurring().list){
    if(!inEnt(r) || r.amt>=0 || r.next>end || r.next<today) continue;
    if(r.cat==='Card bill payment' || (haveEmi && r.cat==='Debt payments') || ['Groceries','Dining','Transport','Shopping','Travel','Health','Other'].includes(r.cat)) continue;
    const last=S.tx.find(t=>r.ids.includes(t.id) && t.acct);

  }

}
function shortfalls(list){
  const byAcct={};
  const push=(id,ev)=>{ (byAcct[id]=byAcct[id]||[]).push(ev); };
  for(const u of list){ if(!u.from || !u.amt) continue; push(u.from, {d:u.d, amt:-u.amt, cur:u.cur, name:u.name}); }
  const today=todayStr(), end=addDays(today,30);
  for(const r of recurring().list){ if(r.amt<=0 || r.next<today || r.next>end) continue; const t=S.tx.find(x=>r.ids.includes(x.id) && x.acct); if(t) push(t.acct, {d:r.next, amt:r.amt, cur:r.cur, name:r.name}); }
  const out=[];
  for(const [id,evs] of Object.entries(byAcct)){
    const a=S.core.items.find(i=>i.id===id && i.kind==='asset'); if(!a || !evs.some(e=>e.amt<0)) continue;
    evs.sort((x,y)=>x.d.localeCompare(y.d) || y.amt-x.amt);

    for(const e of evs){ const v=e.amt*(S.core.rates[e.cur]||1)/(S.core.rates[a.cur]||1); bal+=v; if(v<0){ need+=-v; if(bal<min || !minAt) names.push(e.name); } if(bal<min){ min=bal; minAt=e.d; } }
    if(min<0) out.push({a, amt:need, by:minAt, short:-min, items:[...new Set(names)]});
  }

}

function alertMerchant(raw, out){

function guessCur(raw,l4){ if(/\b(upi|neft|imps|rtgs|nach|inr|rs)\b|₹/i.test(raw)) return 'INR'; if(/\bsar\b|ريال|\bmada\b|مدى|\bstc\b/i.test(raw)) return 'SAR'; const a=acctBy4(l4); return a? a.cur : null; }

/* Split pasted text or a phone log into individual alerts and read each one. */
function rowsFromAlerts(text){
  const rows=[], stmts=[]; let skipped=0; const unread=[];
  const lines=String(text).split(/\r?\n/);
  const logged=lines.filter(l=>l.includes('|') && parseDate(l.split('|')[0].trim()));
  let chunks;
  if(logged.length){
    /* each log entry starts with "date | ..."; a multi-line SMS continues on the following lines */
    chunks=[]; let cur=null;
    for(const l of lines){ if(l.includes('|') && parseDate(l.split('|')[0].trim())){ const p=l.split('|').map(x=>x.trim()); cur={when:p[0], text:p.slice(p.length>2?2:1).join(' | ')}; chunks.push(cur); } else if(cur && l.trim()) cur.text+='\n'+l.trim(); }
    chunks=chunks.filter(c=>!/^[^\d]{0,8}[\d][\d,.\s٫]*[^\d]{0,10}$/.test(c.text.split(' | ')[0]));
  }
  else if(/\n\s*\n/.test(text)) chunks=String(text).split(/\n\s*\n/).map(t=>({text:t}));
  else { const each=lines.filter(l=>l.trim()).map(t=>({text:t})); chunks = each.filter(c=>{ const r=parseAlert(c.text); return r && !r.skip; }).length>=2 ? each : [{text}]; }
  for(const c of chunks){ const r=parseAlert(c.text, c.when);
    if(!r){ if(/\d/.test(c.text) && /(rs|inr|sar|ريال|debit|credit|a\/c|card)/i.test(c.text)) unread.push(c.text); continue; }
    if(r.skip){ skipped++; continue; }
    (r.kind==='stmt'?stmts:rows).push(r); }
  return {rows, stmts, skipped, unread};
}

/* Save rows into the books: dedupe, link to accounts by last 4 digits, update balances. */
function commitRows(rows, stmts=[]){
  ensureReal(); const months=[]; let learned=false, coreChanged=false, added=0; const unknown=new Set();
  const exts=new Set(S.tx.filter(t=>t.ext).map(t=>t.ext));
  const keyOf=(d,amt,cur,l4)=>d+'|'+Math.round(Math.abs(amt))+'|'+cur+'|'+l4;
  const keys=new Set(S.tx.filter(t=>t.l4).map(t=>keyOf(t.d,t.amt,t.cur,t.l4)));
  for(const st of stmts){ const a=acctBy4(st.l4); if(a && a.kind==='liab'){ if(st.due!=null) a.stmtDue=st.due; if(st.min!=null) a.minDue=st.min; if(st.dueDate) a.dueDate=st.dueDate; coreChanged=true; } else if(st.l4) unknown.add(st.l4); }
  for(const r of rows){
    const a=acctBy4(r.l4); const cur=r.cur||(a&&a.cur)||imp.cur;
    if(r.ext && exts.has(r.ext)) continue;
    const k=r.l4? keyOf(r.d,r.amt,cur,String(r.l4).slice(-4)) : null; if(k && keys.has(k)) continue;
    if(r.l4 && !a) unknown.add(String(r.l4).slice(-4));
    if(r.userCat) learned=learnCat(r.desc,r.cat)||learned;
    const auto=categorize(r.desc,r.amt), learnedHit=S.core.learn && S.core.learn[normKey(r.desc)];
    const tx={id:uid(), d:r.d, amt:Math.round(r.amt*100)/100, cur, cat: r.userCat ? r.cat : (learnedHit ? auto : (r.cat || auto)), ent:r.ent||(a&&a.ent)||imp.ent, note:maskSensitive(r.desc).slice(0,140), src:r.src||'import'};
    if(r.ext) tx.ext=r.ext; if(r.l4) tx.l4=String(r.l4).slice(-4); if(a) tx.acct=a.id;
    S.tx.push(tx); months.push(ymOf(r.d)); added++; if(r.ext) exts.add(r.ext); if(k) keys.add(k);
    if(a && a.kind==='asset' && r.bal!=null && (!a.balAt || r.d>=a.balAt)){ a.val=r.bal; a.balAt=r.d; coreChanged=true; }
    if(a && a.kind==='liab'){

      else if(!a.balAt || r.d>=a.balAt){ a.val=Math.max(0,Math.round((a.val + (r.amt<0?1:-1)*Math.abs(r.amt))*100)/100); }

  }

}

/* Inbox: a daily scheduled job reads your bank alert emails and drops them here as inbox-* records. */
const merging=new Set();
function normInboxItem(x){
  if(!x || typeof x!=='object') return null;
  if(x.raw){ const p=parseAlert(x.raw, x.received||x.date); if(p && !p.skip){ if(x.id){ p.ext='em:'+x.id; } p.src='email'; if(x.entity==='business') p.ent='business'; return p; } return null; }
  const l4=x.last4? String(x.last4).replace(/\D/g,'').slice(-4) : null;
  if(x.type==='statement') return {kind:'stmt', l4, due:NUM(x.total_due), min:NUM(x.min_due), dueDate:parseDate(String(x.due_date||''))};
  const d=parseDate(String(x.date||'')); const amt=Number(x.amount); if(!d || !amt) return null;
  return {d, desc:maskSensitive(String(x.description||'Bank alert')).slice(0,140), amt, cur:CURS.includes(x.currency)?x.currency:null, l4,
    bal:x.balance!=null?NUM(x.balance):null, avl:x.available_limit!=null?NUM(x.available_limit):null, ext:x.id?'em:'+x.id:undefined, src:'email',
    ent:x.entity==='business'?'business':undefined, cat:[...EXP_CATS,...INC_CATS].includes(x.category)?x.category:undefined};
}
function mergeInbox(docs){
  const fresh=docs.filter(d=>!merging.has(d.id)); if(!fresh.length || Store.mode!=='cloud') return;
  fresh.forEach(d=>merging.add(d.id));
  const rows=[], stmts=[];
  for(const d of fresh) for(const x of (d.items||[])){ const r=normInboxItem(x); if(r) (r.kind==='stmt'?stmts:rows).push(r); }
  const res=(rows.length||stmts.length) ? commitRows(rows, stmts) : {added:0, unknown:[]};
  for(const d of fresh) enqueue('inbox-'+d.id, ()=>Store.col.doc(d.id).delete());
  setPref('autoLast', new Date().toISOString());
  if(res.added) toast(`${res.added} new from your bank alerts`);
  updateTag(); render();
}

async function shrinkImage(file){
  try{ const bmp=await createImageBitmap(file); const k=Math.min(1,1600/Math.max(bmp.width,bmp.height)); const c=document.createElement('canvas'); c.width=Math.round(bmp.width*k); c.height=Math.round(bmp.height*k); c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(r,'image/jpeg',0.85)); }catch(e){ return file; }
}
const blobB64 = b => new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(',')[1]); r.onerror=()=>rej(r.error); r.readAsDataURL(b); });
function makeApiSample(){
  const call=async(input, opts={})=>{
    const key=prefs().apiKey; if(!key) throw {code:'not_granted'};
    const msgs=(typeof input==='string' ? [{role:'user',content:input}] : input).map(m=>({role:m.role, content:String(m.content)}));
    const merged=[]; for(const m of msgs){ const last=merged[merged.length-1]; if(last && last.role===m.role) last.content+='\n\n'+m.content; else merged.push({...m}); }
    if(opts.images){ const blocks=[]; for(const f of [...opts.images].slice(0,5)){ const sm=await shrinkImage(f); blocks.push({type:'image', source:{type:'base64', media_type:sm.type||'image/jpeg', data:await blobB64(sm)}}); }
      const last=merged[merged.length-1]; last.content=[...blocks, {type:'text', text:last.content}]; }
    let res;
    try{ res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST', signal:opts.signal, headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model: opts.modelTier==='quick' ? 'claude-haiku-5-5' : 'claude-sonnet-5-5', max_tokens:4000, messages:merged})}); }
    catch(e){ throw {code: e && e.name==='AbortError' ? 'cancelled' : 'upstream_error'}; }
    if(!res.ok) throw {code: res.status===401||res.status===403 ? 'bad_key' : res.status===429 ? 'rate_limited' : 'upstream_error'};
    const j=await res.json(); const text=(j.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('');
    if(!text) throw {code:'empty_completion'};
    opts.onText && opts.onText({text, delta:text});
    return {text, truncated:j.stop_reason==='max_tokens'};
  };
  call.json=async(input,opts={})=>{ const {text}=await call(input+'\n\nReply with only the JSON, no other text.', opts);
    const tryP=t=>{ try{ return JSON.parse(t); }catch(e){ return undefined; } };
    let v=tryP(text); if(v!==undefined) return v; const m=text.match(/```(?:json)?\s*([\s\S]*?)```/); if(m && (v=tryP(m[1]))!==undefined) return v;
    const a=text.search(/[\[{]/), b=Math.max(text.lastIndexOf(']'), text.lastIndexOf('}')); if(a>=0 && b>a && (v=tryP(text.slice(a,b+1)))!==undefined) return v;
    throw {code:'invalid_json', text}; };
  return call;
}

function doImport(){

  toast(`Imported ${res.added} transaction${res.added===1?'':'s'}`); imp.rows=[]; imp.stmts=[]; imp.status=res.unknown.length?unknownNote(res.unknown).trim():''; updateTag();

function openSheet(html, onMount){
  $('#sheetRoot').innerHTML=`<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true"><div class="draghandle"><div class="grab"></div></div>${html}</div></div>`;
  const sc=$('#scrim'), sh=sc.querySelector('.sheet');
  sc.addEventListener('click',e=>{ if(e.target===sc) closeSheet(); });
  /* drag down to dismiss, like an iOS sheet */
  let y0=null, t0=0, dy=0;
  const start=e=>{ if(sh.scrollTop>0) return; const h=e.target.closest('.draghandle,h2'); if(!h) return; y0=e.clientY; t0=performance.now(); dy=0; sh.classList.add('dragging'); sh.setPointerCapture&&sh.setPointerCapture(e.pointerId); };
  const move=e=>{ if(y0===null) return; dy=Math.max(0,e.clientY-y0); sh.style.transform=`translateY(${dy}px)`; sc.style.backgroundColor=`rgba(0,0,0,${Math.max(0,.32-dy/900)})`; };
  const end=()=>{ if(y0===null) return; const v=dy/Math.max(1,performance.now()-t0); y0=null; sh.classList.remove('dragging'); sh.style.transform=''; sc.style.backgroundColor='';
    if(dy>140 || (v>.6 && dy>40)) closeSheet(); };
  sh.addEventListener('pointerdown',start); sh.addEventListener('pointermove',move); sh.addEventListener('pointerup',end); sh.addEventListener('pointercancel',end);
  onMount && onMount($('#sheetRoot .sheet'));
  const f=$('#sheetRoot input:not([type=hidden]):not([type=checkbox]), #sheetRoot select'); if(f) setTimeout(()=>f.focus(),60);
}
function closeSheet(){
  const sc=$('#scrim'); if(!sc) return;
  if(reduceMotion){ $('#sheetRoot').innerHTML=''; return; }
  sc.classList.add('closing'); sc.id=''; setTimeout(()=>{ if(sc.parentNode) sc.remove(); }, 300);
}

}

function budgetSheet(){
  const regs=region==='all'?['SA','IN']:[region], prevMs=lastMonths(4).slice(0,3), B=S.core.budgets||{};

  const spendCats=EXP_CATS.filter(c=>!TRANSFER_CATS.includes(c));
  const secs=regs.map(reg=>{
    const avg=within(reg,()=>{ const list=S.tx.filter(inEnt), a={}; for(const ym of prevMs){ const st=monthStats(list,ym); for(const [c,v] of Object.entries(st.cats)) a[c]=(a[c]||0)+v/3; } return a; });
    const cats=spendCats.filter(c=>avg[c]>0 || getB(reg,c)).sort((a,b)=>(avg[b]||0)-(avg[a]||0));
    return {reg, cur:REG_CUR[reg], avg, cats: cats.length?cats:spendCats.slice(0,6)}; });
  let n=0;
  openSheet(`<h2>Monthly budgets</h2><form id="bf">
    <p class="muted" style="font-size:13px;margin:0">Saudi budgets are in riyals and India budgets in rupees. Leave a box empty for no limit. The hint is your 3-month average.</p>
    <button type="button" class="btn small" id="suggest">Fill in suggestions (10% below your average)</button>
    ${secs.map(sc=>`<h3 class="sect" style="margin-top:6px"><span class="cc">${sc.reg}</span>${COUNTRIES[sc.reg]} · ${sc.cur}</h3>
      ${sc.cats.map(c=>{ const i=n++; return `<div class="grid2" style="align-items:center"><label for="b-${i}" style="font-size:14px">${esc(c)}<br><span class="muted num" style="font-size:12px">avg ${fmt(sc.avg[c]||0,sc.cur)}</span></label><input id="b-${i}" data-key="${sc.reg}|${esc(c)}" data-cur="${sc.cur}" data-avg="${sc.avg[c]||0}" inputmode="decimal" class="search" style="padding:9px 12px" value="${getB(sc.reg,c)||''}" placeholder="${sc.cur}"></div>`; }).join('')}`).join('')}
    <div class="actions"><button class="btn primary" type="submit">Save budgets</button></div></form>`, ()=>{
    $('#suggest').onclick=()=>document.querySelectorAll('#bf [data-key]').forEach(inp=>{ const a=Number(inp.dataset.avg), step=inp.dataset.cur==='INR'?500:50; if(a>0) inp.value=Math.max(step, Math.round(a*0.9/step)*step); });

        catch(e){ setPref('faceId',null); st.textContent=faceErr(e); } }; }
    const au=$('#s-auto'); if(au) au.onchange=()=>{ S.core.lock.auto=Number(au.value); persistCore(); toast('Saved'); };
    $('#s-hide').onchange=e=>setPref('hideOnOpen', e.target.checked);
    const vOn=$('#vOn'); if(vOn) vOn.onclick=()=>vaultSheet('on');
    const vOff=$('#vOff'); if(vOff) vOff.onclick=()=>vaultSheet('off');
    const vCh=$('#vChange'); if(vCh) vCh.onclick=()=>vaultSheet('change');
    const vF=$('#vForget'); if(vF) vF.onclick=async()=>{ await idbDel('device'); Vault.key=null; closeSheet(); pendingVault=lastSnap; snapNext=null; showVaultLock('This device is signed out. Enter your passphrase to open it again.'); };
    const bk=$('#bkBtn'); if(bk) bk.onclick=backupSheet;
    $('#keySave').onclick=()=>{ const k=$('#s-key').value.trim(); if(!/^sk-ant-/.test(k)){ toast('That doesn\'t look like a Claude API key.'); return; } setPref('apiKey',k); sampleFn=makeApiSample(); toast('Key saved on this iPhone'); settingsSheet(); };
    const kd=$('#keyDel'); if(kd) kd.onclick=()=>{ setPref('apiKey',null); sampleFn=null; toast('Key removed'); settingsSheet(); };
    $('#rsBtn').onclick=restoreSheet;
    $('#stf').onsubmit=e=>{ e.preventDefault(); S.core.base=$('#s-base').value; S.core.display=$('#s-disp').value; for(const c of CURS){ if(c==='SAR') continue; const v=parseFloat($('#r-'+c).value); if(v>0) S.core.rates[c]=v; }
      const g=parseFloat($('#s-gold').value); if(g>0) S.core.gold=g; recCache=null;
      S.core.india={itr:$('#in-itr').checked, advance:$('#in-adv').checked, presumptive:$('#in-pre').checked, audit:$('#in-aud').checked, gst:$('#in-gst').value==='none'?null:$('#in-gst').value};
      persistCore(); closeSheet(); render(); toast('Settings saved'); };
    const ex=$('#exportBtn'); if(ex) ex.onclick=async()=>{ const lines=[['date','type','amount','currency','category','for','note'].join(',')].concat(S.tx.map(t=>[t.d, t.amt>0?'in':'out', Math.abs(t.amt), t.cur, `"${t.cat}"`, t.ent, `"${(t.note||'').replace(/"/g,'""')}"`].join(',')));
      try{ await downloadsFn.save({filename:`pocket-cfo-${todayStr()}.csv`, data:lines.join('\n')}); }catch(e){ toast('Export was cancelled.'); } };
    const er=$('#eraseBtn'); if(er) er.onclick=()=>confirmIn($('#eraseZone'),"This deletes every transaction, asset, debt, budget and goal. It can't be undone.",'Erase everything',()=>wipeAll(false));
  });
}

/* ---------- render & events ---------- */
function render(){
  if(booting || locked) return;
  const v=$('#view');
  v.innerHTML = tab==='home'?viewHome() : tab==='money'?viewMoney() : tab==='worth'?viewWorth() : tab==='cfo'?viewCfo() : viewImport();
  $('#fab').hidden = !(tab==='home'||tab==='money');
  const ttl={home:'Today', money:'Money', worth:'Wealth', cfo:'Ask CFO', import:'Import'}[tab]; $('#pageTitle').textContent=ttl; $('#navTitle').textContent=ttl;
  countUps(v, false);
  document.title = 'Pocket CFO';
  document.querySelectorAll('#entSeg button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.ent===ent)); syncSeg($('#entSeg'));
  document.querySelectorAll('#regSeg button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.reg===region)); syncSeg($('#regSeg'));
  $('#filters').hidden = tab==='import' || tab==='cfo';
  if(tab==='money'){ const q=$('#q'); q.oninput=()=>{ window._q=q.value; const pos=q.selectionStart; render(); const n=$('#q'); n.focus(); try{n.setSelectionRange(pos,pos);}catch(e){} }; }
  if(tab==='cfo'){ const ta=$('#ask'), sb=$('#sendAsk');
    if(ta){ ta.oninput=()=>{ ta.style.height='auto'; ta.style.height=Math.min(ta.scrollHeight,140)+'px'; }; ta.onkeydown=e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); sb.click(); } }; }
    if(sb) sb.onclick=()=>{ if(chatBusy){ chatCtl&&chatCtl.abort(); return; } const t=ta.value.trim() || 'Give me a full review of my finances'; ta.value=''; ask(t); }; }
  if(tab==='import'){
    $('#impEnt').onchange=e=>imp.ent=e.target.value;
    $('#impCur').onchange=e=>{ imp.cur=e.target.value; if(imp.rows.length){ const keep=imp.rows; setPreview(keep.map(r=>({d:r.d,desc:r.desc,amt:r.amt}))); imp.rows.forEach((r,i)=>{ const o=keep.find(k=>k.d===r.d&&k.desc===r.desc&&k.amt===r.amt); if(o&&o.userCat){ r.cat=o.cat; r.userCat=true; } }); render(); } };
    const f=$('#impFile'); if(f) f.onchange=()=>{ if(f.files[0]) handleFile(f.files[0]); };
    const af=$('#apFile'); if(af) af.onchange=()=>{ if(af.files.length) handleFiles([...af.files]); };
    v.querySelectorAll('[data-imp-on]').forEach(c=>c.onchange=()=>{ const r=imp.rows.find(x=>x.id===c.dataset.impOn); r.on=c.checked; const h=v.querySelector('.cardhead h2'), b=v.querySelector('[data-act="do-import"]'); const n=imp.rows.filter(x=>x.on).length; h.textContent=n+' selected'; b.textContent='Import '+n; b.disabled=!n; });
    v.querySelectorAll('[data-imp-cat]').forEach(s=>s.onchange=()=>{ const r=imp.rows.find(x=>x.id===s.dataset.impCat); r.cat=s.value; r.userCat=true; });
  }
}
const TABS=['home','money','worth','cfo','import'];
function setTab(t){
  const dir = TABS.indexOf(t) >= TABS.indexOf(tab) ? 'enter-r' : 'enter-l', same = t===tab; tab=t;
  document.querySelectorAll('.nav button').forEach(b=>{ if(b.dataset.tab===t){ b.setAttribute('aria-current','page'); b.classList.remove('bounce'); void b.offsetWidth; b.classList.add('bounce'); } else b.removeAttribute('aria-current'); });
  $('#nav .in').style.setProperty('--i', TABS.indexOf(t));
  render(); window.scrollTo({top:0, behavior: same && !reduceMotion ? 'smooth' : 'auto'}); onScroll();
  if(!same) playEnter(dir);
}

document.querySelector('.nav').addEventListener('click',e=>{ const b=e.target.closest('[data-tab]'); if(b) setTab(b.dataset.tab); });
$('#regSeg').addEventListener('click',e=>{ const b=e.target.closest('[data-reg]'); if(!b) return; region=b.dataset.reg; setPref('region',region); render(); playEnter('enter-up'); });
$('#entSeg').addEventListener('click',e=>{ const b=e.target.closest('[data-ent]'); if(!b) return; ent=b.dataset.ent; setPref('ent',ent); render(); playEnter('enter-up'); });
$('#fab').onclick=()=>txSheet();
$('#settingsBtn').onclick=settingsSheet;
$('#lockBtn').onclick=lockNow;
$('#hideBtn').onclick=()=>{ hideAmts=!hideAmts; setPref('hide',hideAmts); updateTag(); render(); toast(hideAmts?'Amounts hidden':'Amounts shown'); };
$('#view').addEventListener('click', async e=>{
  const a=e.target.closest('[data-act],[data-tx],[data-item],[data-ask],[data-goal]'); if(!a) return;
  if(a.dataset.tx){ if(isSample){ toast('This is example data. Tap + to add your own.'); return; } txSheet(S.tx.find(t=>t.id===a.dataset.tx)); return; }
  if(a.dataset.item){ if(isSample){ toast('This is example data. Add your own below.'); return; } const it=S.core.items.find(i=>i.id===a.dataset.item); itemSheet(it.kind, it); return; }
  if(a.dataset.goal){ if(isSample){ toast('This is example data. Tap Add goal to make your own.'); return; } goalSheet((S.core.goals||[]).find(g=>g.id===a.dataset.goal)); return; }
  if(a.dataset.ask){ ask(a.dataset.ask); return; }
  const act=a.dataset.act;
  if(act==='start'){ ensureReal(); updateTag(); render(); toast('Ready. Add a transaction or import a statement.'); }
  else if(act==='review'){ if(sampleFn){ setTab('cfo'); ask('Give me a full review of my finances'); } else copyForClaude('Give me a full review of my finances'); }
  else if(act==='ask-claude'){ const t=($('#ask')&&$('#ask').value.trim())||'Give me a full review of my finances'; copyForClaude(t); }
  else if(act==='more'){ window._limit=(window._limit||150)+150; render(); }
  else if(act==='add-asset') itemSheet('asset');
  else if(act==='add-liab') itemSheet('liab');
  else if(act==='add-card') itemSheet('liab', null, 'card');
  else if(act==='add-goal') goalSheet();
  else if(act==='budgets') budgetSheet();
  else if(act==='settings') settingsSheet();
  else if(act==='clearchat'){ chatCtl&&chatCtl.abort(); chat.length=0; render(); }
  else if(act==='do-import') doImport();
  else if(act==='ai-sort') aiSortRest();
  else if(act==='ap-pick'){ const f=$('#apFile'); f.value=''; f.click(); }
  else if(act==='pdfpass'){ const p=$('#pdfPass').value; if(p && pendingPdf) handleFile(pendingPdf, p); }
  else if(act==='parse-paste'){ const t=$('#impPaste').value; if(!t.trim()) return; imp.busy=true; imp.status='Reading…'; render();
    try{ await readText(t); }catch(err){ imp.status=importError(err); } imp.busy=false; render(); }
});

/* ---------- boot ---------- */
updateTag();
initStore();
downloadsFn={ save: ({filename, data}) => saveFile(filename, data, /\.csv$/.test(filename)?'text/csv':'application/octet-stream') };
sampleFn = prefs().apiKey ? makeApiSample() : null; sampleReady=true;
if('serviceWorker' in navigator && location.protocol==='https:'){ addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }); }
</script>
</body>
